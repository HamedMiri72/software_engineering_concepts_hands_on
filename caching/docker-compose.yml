# Self-contained deps for the caching project ONLY.
# Container names & ports are namespaced so this never clashes with other concepts.
services:
  postgres:
    image: postgres:16-alpine
    container_name: caching-postgres
    environment:
      POSTGRES_DB: caching
      POSTGRES_USER: se
      POSTGRES_PASSWORD: se
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U se -d caching" ]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caching-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
